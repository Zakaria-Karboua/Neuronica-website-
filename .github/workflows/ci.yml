name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check . --exit-zero
        # exit-zero for now: surfaces issues in the Actions log without
        # blocking merges on style nits while the codebase is still young.
        # Drop --exit-zero once the codebase is ruff-clean and you want it
        # to actually gate merges.

      - name: Run tests
        env:
          DJANGO_DEBUG: "True" # SQLite + relaxed settings for CI; never use in real deployments
        run: python manage.py test
